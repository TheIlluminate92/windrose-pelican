name: Verify upstream Windrose Yolk draft
on:
  push:
    branches: [verify/yolks-windrose-386]
permissions:
  contents: read
jobs:
  exact-yolk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TheIlluminate92/yolks
          ref: 8c74f9ce68a53341109016370ca8a5a7fec2ece7
          path: yolks-candidate
          persist-credentials: false
      - name: Build the exact upstream draft
        run: docker build --platform linux/amd64 -t windrose-yolk:review yolks-candidate/games/windrose
      - name: Run the actual installer and first-world restore
        run: ./tests/integration.sh
        env:
          WINDROSE_TEST_IMAGE: windrose-yolk:review
          WINDROSE_TEST_FETCH: '1'
